name: Bug report
description: Create a report to help us improve
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is, and what you expected instead.
      placeholder: I was doing X and Y happened...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: To Reproduce
      description: The witr command you ran and its output (with `--no-color`; `--json` output helps too). Say whether you ran it with sudo or as Administrator, and whether it ran inside WSL, a container or a VM.
      placeholder: |
        1. Run `witr --port 8080`
        2. See error
  - type: input
    id: os
    attributes:
      label: OS
      description: e.g. macOS, Ubuntu, Windows (mention WSL if you use it)
      placeholder: macOS 14.0
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `witr --version`
      placeholder: witr vX.Y.Z (commit ..., built ...)
  - type: input
    id: arch
    attributes:
      label: Architecture
      description: e.g. amd64, arm64, loong64
      placeholder: amd64
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
